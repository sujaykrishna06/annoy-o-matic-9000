<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoTyper • Apple Glass</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      background: transparent;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      color: #ffffff;
    }

    /* User's Exact Glass Card CSS */
    .glass-card {
      width: 340px;
      height: 520px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 
        0 12px 40px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.5),
        inset 0 -1px 0 rgba(255, 255, 255, 0.1),
        inset 0 0 0px 0px rgba(255, 255, 255, 0);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 16px 20px;
    }

    .glass-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.8),
        transparent
      );
      pointer-events: none;
    }

    .glass-card::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 1px;
      height: 100%;
      background: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.8),
        transparent,
        rgba(255, 255, 255, 0.3)
      );
      pointer-events: none;
    }

    /* macOS Window Drag Bar */
    .titlebar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      cursor: grab;
      -webkit-app-region: drag;
    }

    .traffic-lights {
      display: flex;
      gap: 7px;
      -webkit-app-region: no-drag;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .dot:hover {
      transform: scale(1.1);
      opacity: 0.85;
    }

    .dot-close { background: #ff5f56; border: 1px solid #e0443e; }
    .dot-min { background: #ffbd2e; border: 1px solid #dea123; }
    .dot-max { background: #27c93f; border: 1px solid #1aab29; }

    .app-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: -0.2px;
      color: rgba(255, 255, 255, 0.9);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge-pill {
      font-size: 9px;
      font-weight: 700;
      background: rgba(10, 132, 255, 0.25);
      border: 1px solid rgba(10, 132, 255, 0.5);
      color: #64d2ff;
      padding: 2px 7px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Form Section */
    .section-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: rgba(255, 255, 255, 0.5);
      margin-bottom: 6px;
    }

    .glass-input-box {
      width: 100%;
      height: 90px;
      background: rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 10px;
      color: #ffffff;
      font-family: "Consolas", monospace;
      font-size: 13px;
      resize: none;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
      user-select: text;
      -webkit-user-select: text;
    }

    .glass-input-box:focus {
      border-color: rgba(10, 132, 255, 0.6);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3), 0 0 10px rgba(10, 132, 255, 0.3);
    }

    /* Apple Segmented Control */
    .segmented-control {
      background: rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      padding: 4px;
      display: flex;
      gap: 4px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      margin-bottom: 14px;
    }

    .segment-btn {
      flex: 1;
      padding: 7px 0;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: rgba(255, 255, 255, 0.6);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .segment-btn.active {
      background: rgba(255, 255, 255, 0.22);
      color: #ffffff;
      box-shadow: 0 3px 10px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255, 255, 255, 0.5);
    }

    /* Settings Card */
    .settings-glass-card {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 14px;
    }

    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.85);
    }

    .setting-input {
      width: 60px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      text-align: center;
      padding: 4px;
      outline: none;
      user-select: text;
      -webkit-user-select: text;
    }

    /* Status Banner */
    .status-pill {
      background: rgba(10, 132, 255, 0.15);
      border: 1px solid rgba(10, 132, 255, 0.3);
      border-radius: 10px;
      padding: 8px 12px;
      text-align: center;
      font-size: 11px;
      font-weight: 600;
      color: #64d2ff;
      margin-bottom: 14px;
      transition: all 0.2s ease;
    }

    /* Apple Buttons */
    .button-group {
      display: flex;
      gap: 10px;
      margin-top: auto;
    }

    .apple-btn {
      flex: 1;
      padding: 12px 14px;
      border-radius: 12px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.3);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      position: relative;
      overflow: hidden;
    }

    .apple-btn-start {
      background: linear-gradient(135deg, rgba(48, 209, 88, 0.85), rgba(34, 160, 68, 0.95));
      color: #ffffff;
      box-shadow: 
        0 4px 18px rgba(48, 209, 88, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.6);
    }

    .apple-btn-start:hover {
      background: linear-gradient(135deg, rgba(52, 225, 95, 0.95), rgba(38, 185, 78, 1));
      transform: translateY(-1px);
      box-shadow: 
        0 6px 25px rgba(48, 209, 88, 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.8);
    }

    .apple-btn-start:active {
      transform: translateY(1px);
    }

    .apple-btn-stop {
      background: linear-gradient(135deg, rgba(255, 69, 58, 0.85), rgba(215, 45, 36, 0.95));
      color: #ffffff;
      box-shadow: 
        0 4px 18px rgba(255, 69, 58, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.6);
      opacity: 0.6;
      cursor: not-allowed;
    }

    .apple-btn-stop.active {
      opacity: 1;
      cursor: pointer;
    }

    .apple-btn-stop.active:hover {
      background: linear-gradient(135deg, rgba(255, 85, 75, 0.95), rgba(230, 50, 40, 1));
      transform: translateY(-1px);
      box-shadow: 
        0 6px 25px rgba(255, 69, 58, 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.8);
    }
  </style>
</head>
<body>

  <!-- Exact Glass Card Container -->
  <div class="glass-card">

    <!-- macOS Title Bar -->
    <div class="titlebar">
      <div class="traffic-lights">
        <div class="dot dot-close" id="btn-close"></div>
        <div class="dot dot-min" id="btn-min"></div>
        <div class="dot dot-max"></div>
      </div>
      <div class="app-title">⚡ AutoTyper</div>
      <div class="badge-pill">Floating</div>
    </div>

    <!-- Text Input -->
    <div class="section-label">Target Message Text</div>
    <textarea id="targetText" class="glass-input-box" placeholder="Type text here...">sujay</textarea>

    <!-- Splitting Mode -->
    <div class="section-label" style="margin-top: 10px;">Splitting Mode</div>
    <div class="segmented-control">
      <button class="segment-btn active" id="btn-letter" onclick="setMode('letter')">🔤 Letter</button>
      <button class="segment-btn" id="btn-word" onclick="setMode('word')">💬 Word</button>
      <button class="segment-btn" id="btn-line" onclick="setMode('line')">📄 Line</button>
    </div>

    <!-- Delay Settings -->
    <div class="settings-glass-card">
      <div class="setting-row">
        <span>Message Delay (sec)</span>
        <input type="number" id="msgDelay" class="setting-input" value="0.15" step="0.05" min="0.05" max="5">
      </div>
      <div class="setting-row">
        <span>Start Countdown (sec)</span>
        <input type="number" id="startCountdown" class="setting-input" value="3" step="1" min="1" max="10">
      </div>
    </div>

    <!-- Status Banner -->
    <div id="statusPill" class="status-pill">Ready • Click Start</div>

    <!-- Action Buttons -->
    <div class="button-group">
      <button id="startBtn" class="apple-btn apple-btn-start" onclick="onStart()">▶ Start</button>
      <button id="stopBtn" class="apple-btn apple-btn-stop" onclick="onStop()">⬛ Abort</button>
    </div>

  </div>

  <script>
    let currentMode = 'letter';
    let isRunning = false;

    function setMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.segment-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(`btn-${mode}`).classList.add('active');
    }

    function setStatus(text, color = '#64d2ff', bg = 'rgba(10, 132, 255, 0.15)', border = 'rgba(10, 132, 255, 0.3)') {
      const pill = document.getElementById('statusPill');
      pill.innerText = text;
      pill.style.color = color;
      pill.style.background = bg;
      pill.style.borderColor = border;
    }

    function onStart() {
      const text = document.getElementById('targetText').value.trim();
      if (!text) {
        setStatus('⚠️ Please enter text first!', '#ff453a', 'rgba(255, 69, 58, 0.15)', 'rgba(255, 69, 58, 0.3)');
        return;
      }

      const delay = parseFloat(document.getElementById('msgDelay').value) || 0.15;
      const countdown = parseInt(document.getElementById('startCountdown').value) || 3;

      isRunning = true;
      document.getElementById('startBtn').style.opacity = '0.5';
      document.getElementById('startBtn').style.cursor = 'not-allowed';
      document.getElementById('stopBtn').classList.add('active');

      if (window.pywebview) {
        window.pywebview.api.start(text, currentMode, delay, countdown);
      } else {
        simulateTyping(text, currentMode, delay, countdown);
      }
    }

    function onStop() {
      if (!isRunning) return;
      if (window.pywebview) {
        window.pywebview.api.stop();
      }
      resetUI('🛑 Aborted by user');
    }

    function resetUI(msg) {
      isRunning = false;
      document.getElementById('startBtn').style.opacity = '1';
      document.getElementById('startBtn').style.cursor = 'pointer';
      document.getElementById('stopBtn').classList.remove('active');
      setStatus(msg || 'Ready • Click Start');
    }

    // Fallback simulation for browser testing
    function simulateTyping(text, mode, delay, countdown) {
      let count = countdown;
      const timer = setInterval(() => {
        if (!isRunning) { clearInterval(timer); return; }
        if (count > 0) {
          setStatus(`⏳ Click chat box! Starting in ${count}s...`, '#ffd60a', 'rgba(255, 214, 10, 0.15)', 'rgba(255, 214, 10, 0.3)');
          count--;
        } else {
          clearInterval(timer);
          setStatus('⚡ Typing in progress...', '#30d158', 'rgba(48, 209, 88, 0.15)', 'rgba(48, 209, 88, 0.3)');
          setTimeout(() => resetUI('✅ Finished sending!'), 2000);
        }
      }, 1000);
    }

    document.getElementById('btn-close').onclick = () => {
      if (window.pywebview) window.pywebview.api.close();
      else window.close();
    };

    document.getElementById('btn-min').onclick = () => {
      if (window.pywebview) window.pywebview.api.minimize();
    };
  </script>
</body>
</html>
